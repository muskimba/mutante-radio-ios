name: Screenshots iOS (App Store)

# Gera screenshots automáticos no Simulador do iOS, direto no Mac da nuvem do
# GitHub Actions — não precisa de conta Apple nem assinatura de código (build
# de simulador não é assinado). Dá pra rodar quantas vezes quiser, de graça.
on:
  workflow_dispatch:

jobs:
  screenshots:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          channel: stable
          cache: true

      - name: flutter pub get
        run: flutter pub get

      - name: CocoaPods
        working-directory: ios
        run: pod install --repo-update

      - name: Build para o Simulador (normal)
        run: |
          flutter build ios --simulator --debug
          cp -R build/ios/iphonesimulator/Runner.app /tmp/Runner-normal.app

      - name: "Build para o Simulador (demo - toca e abre o player)"
        run: |
          flutter build ios --simulator --debug --dart-define=DEMO_MODE=true
          cp -R build/ios/iphonesimulator/Runner.app /tmp/Runner-demo.app

      - name: Preparar e capturar screenshots
        run: |
          set -e
          BUNDLE_ID="com.mutanteradio.mutanteRadio"
          OUT="screenshots"
          mkdir -p "$OUT"

          RUNTIME=$(xcrun simctl list runtimes -j | jq -r '
            [.runtimes[] | select(.name | startswith("iOS"))] | sort_by(.version) | last | .identifier')

          pick () {
            xcrun simctl list devices -j | jq -r --arg rt "$RUNTIME" --arg pat "$1" '
              .devices[$rt][]? | select(.isAvailable) | select(.name | test($pat)) | .udid' | head -1
          }

          capture () {
            # $1 = prefixo do arquivo, $2 = UDID
            local TAG="$1" UDID="$2"
            echo "=== $TAG — $UDID ==="
            xcrun simctl boot "$UDID" || true
            xcrun simctl bootstatus "$UDID" -b
            open -a Simulator --args -CurrentDeviceUDID "$UDID" || true
            xcrun simctl status_bar "$UDID" override --time 9:41 --batteryState charged --batteryLevel 100 --cellularBars 4 --wifiBars 3 || true

            xcrun simctl install "$UDID" /tmp/Runner-normal.app
            xcrun simctl launch "$UDID" "$BUNDLE_ID"
            sleep 30
            xcrun simctl terminate "$UDID" "$BUNDLE_ID" || true
            xcrun simctl launch "$UDID" "$BUNDLE_ID"
            sleep 25
            xcrun simctl io "$UDID" screenshot "$OUT/${TAG}-01-home.png"
            xcrun simctl terminate "$UDID" "$BUNDLE_ID" || true

            xcrun simctl install "$UDID" /tmp/Runner-demo.app
            xcrun simctl launch "$UDID" "$BUNDLE_ID"
            sleep 30
            xcrun simctl io "$UDID" screenshot "$OUT/${TAG}-02-player.png"
            xcrun simctl terminate "$UDID" "$BUNDLE_ID" || true
            xcrun simctl shutdown "$UDID" || true
          }

          IPHONE=$(pick "Pro Max")
          IPAD=$(pick "iPad.*13")
          echo "iPhone=$IPHONE iPad=$IPAD"
          [ -n "$IPHONE" ] && capture iphone "$IPHONE"
          [ -n "$IPAD" ] && capture ipad "$IPAD"
          ls -la "$OUT"

      - name: Guardar screenshots
        uses: actions/upload-artifact@v4
        with:
          name: app-store-screenshots
          path: screenshots/*.png
          if-no-files-found: warn
