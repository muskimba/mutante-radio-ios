name: Screenshots iOS (App Store)

# Gera screenshots automáticos no Simulador do iOS, direto no Mac da nuvem do
# GitHub Actions — não precisa de conta Apple nem assinatura de código (build
# de simulador não é assinado). Dá pra rodar quantas vezes quiser, de graça.
on:
  workflow_dispatch:

jobs:
  screenshots:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          channel: stable
          cache: true

      - name: flutter pub get
        run: flutter pub get

      - name: CocoaPods
        working-directory: ios
        run: pod install --repo-update

      - name: Build para o Simulador
        run: flutter build ios --simulator --debug

      - name: Listar simuladores disponíveis
        run: xcrun simctl list devices available

      - name: Preparar e capturar screenshots
        run: |
          set -e
          APP_PATH="build/ios/iphonesimulator/Runner.app"
          BUNDLE_ID="com.mutanteradio.mutanteRadio"
          OUT="screenshots"
          mkdir -p "$OUT"

          # descobre o runtime iOS mais novo disponível nesse runner (o nome
          # dos aparelhos muda a cada ano/imagem, então nunca fixamos nomes)
          RUNTIME=$(xcrun simctl list runtimes -j | jq -r '
            [.runtimes[] | select(.name | startswith("iOS"))] | sort_by(.version) | last | .identifier')
          echo "Runtime: $RUNTIME"

          pick_udid () {
            # $1 = regex preferido (ex.: "Pro Max"), $2 = lista de UDIDs a excluir
            xcrun simctl list devices -j | jq -r --arg rt "$RUNTIME" --arg pat "$1" '
              .devices[$rt][]? | select(.isAvailable) | select(.name | test($pat)) | .udid' \
              | grep -vxF -f <(echo "$2") | head -1
          }

          MAIN_UDID=$(pick_udid "Pro Max" "")
          if [ -z "$MAIN_UDID" ]; then
            MAIN_UDID=$(xcrun simctl list devices -j | jq -r --arg rt "$RUNTIME" '
              .devices[$rt][]? | select(.isAvailable) | .udid' | head -1)
          fi
          SECOND_UDID=$(pick_udid "Plus|SE" "$MAIN_UDID")

          DEVICE_IDS=("6.9in:$MAIN_UDID")
          if [ -n "$SECOND_UDID" ] && [ "$SECOND_UDID" != "$MAIN_UDID" ]; then
            DEVICE_IDS+=("5.5in:$SECOND_UDID")
          fi

          for entry in "${DEVICE_IDS[@]}"; do
            TAG="${entry%%:*}"
            UDID="${entry##*:}"
            NAME=$(xcrun simctl list devices -j | jq -r --arg rt "$RUNTIME" --arg u "$UDID" '
              .devices[$rt][]? | select(.udid==$u) | .name')
            echo "=== $NAME ($TAG) — $UDID ==="

            xcrun simctl boot "$UDID" || true
            xcrun simctl bootstatus "$UDID" -b
            xcrun simctl install "$UDID" "$APP_PATH"
            xcrun simctl launch "$UDID" "$BUNDLE_ID"

            # dá tempo do site carregar dentro do WebView antes da captura
            sleep 15
            xcrun simctl io "$UDID" screenshot "$OUT/${TAG}-01-app.png"

            xcrun simctl shutdown "$UDID" || true
          done

          ls -la "$OUT"

      - name: Guardar screenshots
        uses: actions/upload-artifact@v4
        with:
          name: app-store-screenshots
          path: screenshots/*.png
          if-no-files-found: warn
